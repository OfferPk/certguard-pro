<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gradeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Top App Bar -->
  <rect x="30" y="24" width="1140" height="60" rx="10" fill="#131e33" stroke="#233554" stroke-width="1.5"/>
  <rect x="46" y="38" width="32" height="32" rx="6" fill="url(#accent)"/>
  <text x="62" y="60" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" text-anchor="middle">CG</text>
  <text x="90" y="58" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">CertGuard Pro</text>
  <text x="240" y="57" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">RFC 8659 CAA DNS Studio &amp; Rogue Certificate Defense</text>
  
  <rect x="940" y="40" width="100" height="26" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="990" y="57" fill="#06b6d4" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">RFC 8659 / 8657</text>
  <rect x="1050" y="40" width="105" height="26" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4"/>
  <text x="1102" y="57" fill="#3b82f6" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CA/B Mandatory</text>

  <!-- Left Column: Config -->
  <rect x="30" y="104" width="555" height="360" rx="10" fill="#131e33" stroke="#233554" stroke-width="1.5"/>
  <text x="50" y="134" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">1. CAA Resource Record Configuration</text>

  <text x="50" y="166" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Target Domain:</text>
  <rect x="50" y="174" width="515" height="34" rx="6" fill="#090f1d" stroke="#233554"/>
  <text x="64" y="196" fill="#38bdf8" font-family="monospace" font-size="13">secure.globalbank.com</text>

  <text x="50" y="234" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Authorized Certificate Authorities (issue):</text>
  
  <!-- CA Chips -->
  <rect x="50" y="244" width="248" height="36" rx="6" fill="#090f1d" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="66" y="267" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">&#10003; DigiCert (Tier-1)</text>

  <rect x="316" y="244" width="248" height="36" rx="6" fill="#090f1d" stroke="#233554"/>
  <text x="332" y="267" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Let's Encrypt (ISRG)</text>

  <!-- Wildcard & Parameters -->
  <text x="50" y="306" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Wildcard Policy: issuewild ";" (Strictly Prohibited)</text>
  <text x="50" y="332" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Account Binding: accounturi=https://acme.digicert.com/v2/acct/987654321</text>
  <text x="50" y="356" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Validation Method: validationmethods=dns-01 (Rebuffs BGP)</text>

  <!-- Live Zone Box -->
  <rect x="50" y="376" width="515" height="70" rx="6" fill="#060b14" stroke="#233554"/>
  <text x="64" y="396" fill="#34d399" font-family="monospace" font-size="11">secure.globalbank.com. IN CAA 0 issue "digicert.com; accounturi=..."</text>
  <text x="64" y="416" fill="#34d399" font-family="monospace" font-size="11">secure.globalbank.com. IN CAA 0 issuewild ";"</text>
  <text x="64" y="434" fill="#34d399" font-family="monospace" font-size="11">secure.globalbank.com. IN CAA 0 iodef "mailto:soc-alerts@globalbank.com"</text>

  <!-- Right Column: 10-Point Scorecard -->
  <rect x="615" y="104" width="555" height="360" rx="10" fill="#131e33" stroke="#233554" stroke-width="1.5"/>
  <text x="635" y="134" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">2. 10-Point Security &amp; CT Scorecard</text>

  <rect x="635" y="152" width="515" height="74" rx="8" fill="#090f1d" stroke="#233554"/>
  <circle cx="678" cy="189" r="28" fill="url(#gradeGrad)"/>
  <text x="678" y="196" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" text-anchor="middle">A+</text>
  <text x="722" y="180" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">100 / 100 Score</text>
  <text x="722" y="200" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12">Zero-Trust Enterprise Hardened &bull; CT Aligned</text>
  <text x="1080" y="184" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="end">10 / 10 Passed</text>
  <text x="1080" y="200" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" text-anchor="end">0 Warnings &bull; 0 Fails</text>

  <!-- Audit List Items -->
  <rect x="635" y="238" width="515" height="32" rx="4" fill="#0d1627" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="258" fill="#34d399" font-family="monospace" font-size="11">[PASS] RFC 8659 CAA Existence: 3 valid CAA resource records found.</text>

  <rect x="635" y="278" width="515" height="32" rx="4" fill="#0d1627" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="298" fill="#34d399" font-family="monospace" font-size="11">[PASS] Single-Issuer Principle: Minimal CA surface (digicert.com only).</text>

  <rect x="635" y="318" width="515" height="32" rx="4" fill="#0d1627" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="338" fill="#34d399" font-family="monospace" font-size="11">[PASS] Wildcard Lockdown: issuewild ";" blocks unauthorized wildcards.</text>

  <rect x="635" y="358" width="515" height="32" rx="4" fill="#0d1627" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="378" fill="#34d399" font-family="monospace" font-size="11">[PASS] ACME Account Binding: Locked to authorized accounturi.</text>

  <rect x="635" y="398" width="515" height="32" rx="4" fill="#0d1627" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="647" y="418" fill="#34d399" font-family="monospace" font-size="11">[PASS] Rogue Alerting: iodef mailto:soc-alerts@globalbank.com active.</text>

  <!-- Bottom Panel: Multi-DNS Synthesizer -->
  <rect x="30" y="484" width="1140" height="190" rx="10" fill="#131e33" stroke="#233554" stroke-width="1.5"/>
  <text x="50" y="514" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">3. Multi-DNS Provider Synthesizer (Cloudflare, Route53, Terraform)</text>

  <rect x="50" y="528" width="1100" height="130" rx="6" fill="#050a14" stroke="#1f2937"/>
  <text x="66" y="552" fill="#60a5fa" font-family="monospace" font-size="12"># Terraform / OpenTofu HCL Definition</text>
  <text x="66" y="572" fill="#cbd5e1" font-family="monospace" font-size="12">resource "cloudflare_record" "caa_issue" {</text>
  <text x="96" y="592" fill="#34d399" font-family="monospace" font-size="12">zone_id = var.cloudflare_zone_id; name = "secure.globalbank.com"; type = "CAA"</text>
  <text x="96" y="612" fill="#34d399" font-family="monospace" font-size="12">data { flags = 0; tag = "issue"; value = "digicert.com; accounturi=..." }</text>
  <text x="66" y="632" fill="#cbd5e1" font-family="monospace" font-size="12">}</text>
</svg>
